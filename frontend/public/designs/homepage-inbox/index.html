<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoundReel Homepage — Inbox First</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; background: #0f1115; color: #e8eaed; font-family: system-ui, sans-serif; padding: 24px; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
  p { opacity: .75; margin: 0 0 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
  figure { margin: 0; background: #1a1d24; border-radius: 12px; overflow: hidden; border: 1px solid #2a2e38; }
  img { width: 100%; display: block; background: #000; }
  figcaption { padding: 14px 16px; font-size: .95rem; line-height: 1.4; }
  b { color: #fff; }
  .pick { margin-top: 24px; padding: 16px; border: 1px dashed #3a3f4b; border-radius: 10px; }
</style>
</head>
<body>
  <h1>Homepage Inbox First — 3 stili</h1>
  <p>Scegli A, B, C o un remix. Dimmi la lettera in chat.</p>
  <div class="grid">
    <figure>
      <img src="variant-A.png" alt="Variant A Editorial mono">
      <figcaption><b>A — Editorial mono</b><br>Inter, charcoal, accent verde. Input dominante, lista recente quieta, filtri nascosti.</figcaption>
    </figure>
    <figure>
      <img src="variant-B.png" alt="Variant B Warm cinematic">
      <figcaption><b>B — Warm cinematic</b><br>Playfair + ambra, thumb grandi stile film, glow caldo.</figcaption>
    </figure>
    <figure>
      <img src="variant-C.png" alt="Variant C Swiss brutalist">
      <figcaption><b>C — Swiss brutalist</b><br>Bordi netti, blu elettrico, date bold, look newspaper.</figcaption>
    </figure>
  </div>
  <div class="pick">Opzioni: <b>A</b> · <b>B</b> · <b>C</b> · <b>Remix A+B</b> (layout A + thumb/warm da B)</div>
</body>
</html>
