services:
  soundreel:
    build:
      context: .
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    image: soundreel:local
    container_name: soundreel
    # node e' PID 1 e non raccoglie gli orfani: i chromium/chrome_crashpad
    # lasciati da Puppeteer restavano zombie.
    init: true
    env_file: [.env]
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DB_HOST: soundreel-db
      DB_PORT: 5432
      DB_NAME: soundreel
      DB_USER: soundreel
      OLLAMA_URL: http://gpu-router:9000
      # Il modello dei TITOLI delle playlist automatiche per i post che elencano musica (ADR-0023). Il piccolo di default lascia refusi; un
      # modello grosso sta su vulcano (via gpu-router, ~2 s a post) e, se non risponde, il titolo lo fa il modello di default. Vuoto = solo il default.
      AUTO_PLAYLIST_MODEL: ${AUTO_PLAYLIST_MODEL-qwen3.5:122b}
      INSTALOADER_URL: http://soundreel-instaloader:5000
      # Chi trascrive lo sceglie il gpu-router: archi-pc quando c'e', altrimenti
      # accende il whisper locale. Puntare qui direttamente ad archi-pc
      # significava dipendere da una macchina spenta quasi sempre.
      WHISPER_URL: ${WHISPER_URL:-http://gpu-router:9000/whisper}
      OCR_URL: http://soundreel-ocr:5001
      # TTS via gpu-router pool (scelta B). Private docs: X-TTS-Local-Only from /api/tts/render.
      TTS_URL: ${TTS_URL:-http://gpu-router:9000/tts}
      MEDIA_ROOT: /data/media
      FRONTEND_URL: https://soundreel.casamon.dev
      SPOTIFY_REDIRECT_URI: https://oauth.casamon.dev/spotify/callback
      MUSIC_LIBRARY_PATH: /music
      MUSIC_STORE_DIR: SoundReel
      # Library search (ADR-0011): the roots the "Cartelle musica" configuration may pick folders from. /music (Spooty's
      # folder) is always searched; more host folders are mounted read-only under /music-extra (see volumes below).
      MUSIC_EXTRA_ROOTS: ${MUSIC_EXTRA_ROOTS:-/music-extra}
      # How the library's root is shown in a result's location (the container sees /music, the host calls it ~/Music).
      MUSIC_LIBRARY_LABEL: ${MUSIC_LIBRARY_LABEL:-~/Music}
      FILMS_LIBRARY_PATH: /films
      # Push to the phones (APNs, ADR-0015). Off until the key exists: set APNS_KEY_ID and APNS_KEY_FILE in .env
      # (the file name inside the container, e.g. /run/secrets/apns/AuthKey_<KeyID>.p8). The key itself is never in
      # the repository, in .env or in a log.
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-5NZADC9YQ2}
      APNS_KEY_FILE: ${APNS_KEY_FILE:-}
      APNS_TOPIC: ${APNS_TOPIC:-it.mikesoft.mondrop}
    volumes:
      - soundreel_media:/data/media
      # The APNs auth key (AuthKey_<KeyID>.p8, mode 0600), created by Michele in the Apple Developer portal. Read-only.
      # The directory must exist on the host before `up` (else Docker creates it as root).
      - /home/mike/.config/soundreel/apns:/run/secrets/apns:ro
      - /home/mike/Music:/music:ro
      # The one writable corner of the library: songs fetched from YouTube land here (MUSIC_STORE_DIR),
      # so the library scan, the web player and the "downloaded" flags see them like Spooty's files.
      # The directory must exist on the host before `up` (else Docker creates it as root).
      - /home/mike/Music/SoundReel:/music/SoundReel
      # Other music folders to search (library search, ADR-0011): mount each READ-ONLY under /music-extra, then add it
      # in the web configuration ("Cartelle musica"). Example (uncomment and adapt; needs a redeploy):
      # - /home/mike/Downloads:/music-extra/Downloads:ro
      - /home/mike/Films:/films
    depends_on:
      soundreel-db:
        condition: service_healthy
      soundreel-instaloader:
        condition: service_started
      soundreel-ocr:
        condition: service_started
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - default
      - web
    restart: unless-stopped

  soundreel-db:
    image: postgres:17-alpine
    container_name: soundreel-db
    environment:
      POSTGRES_DB: soundreel
      POSTGRES_USER: soundreel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - soundreel_pgdata:/var/lib/postgresql/data
      - ./backend/src/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U soundreel -d soundreel"]
      interval: 30s
      timeout: 3s
      retries: 10
    networks: [default]
    restart: unless-stopped

  soundreel-instaloader:
    build:
      context: ./instaloader
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    image: soundreel-instaloader:local
    container_name: soundreel-instaloader
    environment:
      INSTALOADER_USERNAME: ${INSTALOADER_USERNAME:-}
      MEDIA_ROOT: /data/media
      FRAME_INTERVAL_SECONDS: "2"
      MAX_FRAMES: "15"
    volumes:
      - soundreel_instaloader_session:/root/.config/instaloader
      - soundreel_media:/data/media
    networks: [default]
    restart: unless-stopped

  soundreel-whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: soundreel-whisper
    profiles: [local-whisper]
    environment:
      ASR_MODEL: ${WHISPER_MODEL:-small}
      ASR_ENGINE: faster_whisper
    volumes:
      - soundreel_media:/data/media:ro
      - soundreel_whisper_models:/root/.cache/whisper
    # `web` serve al gpu-router per raggiungerlo: e' la rete su cui vive.
    # Rischio presentato e accettato il 2026-08-30: qui dentro il servizio
    # e' raggiungibile da ogni altro container su `web`, non solo dal
    # router, ed e' un endpoint di trascrizione senza autenticazione.
    # Nessuna porta viene pubblicata sull'host, quindi il perimetro esterno
    # non cambia.
    networks: [default, web]
    restart: unless-stopped

  soundreel-ocr:
    build:
      context: ./ocr
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
        BUILD_DATE: ${BUILD_DATE:-}
    image: soundreel-ocr:local
    container_name: soundreel-ocr
    volumes:
      - soundreel_media:/data/media:ro
    networks: [default]
    restart: unless-stopped

networks:
  web:
    external: true

volumes:
  soundreel_pgdata:
  soundreel_instaloader_session:
  soundreel_media:
  soundreel_whisper_models:
